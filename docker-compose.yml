services:
  interval-timer:
    container_name: interval-timer
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BASE_PATH=/interval-timer
    ports:
      - "3002:3000" # Change 3001 to whatever port is next in your sequence
    networks:
      - svelte_network
    volumes:
      - timer-data:/app/prisma

volumes:
  timer-data:

networks:
  svelte_network:
    driver: bridge